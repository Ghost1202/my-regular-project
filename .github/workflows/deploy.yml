name: Deploy to EC2

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  deploy:
    name: Deploy application to EC2
    runs-on: ubuntu-latest
    needs: build

    env:
      EC2_REMOTE_PATH: /home/ec2-user/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync docker-compose files to EC2
        run: |
          rsync -avz -e "ssh -i ~/.ssh/ec2_key" \
            docker-compose.yml docker-compose.override.yml \
            ${{ secrets.EC2_USER || 'ec2-user' }}@${{ secrets.EC2_HOST }}:${{ env.EC2_REMOTE_PATH }}/

      - name: Start services if not running
        run: |
          ssh -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER || 'ec2-user' }}@${{ secrets.EC2_HOST }} <<'EOF'
          set -euo pipefail
          cd /home/ec2-user/app
          docker compose up -d --remove-orphans
          EOF