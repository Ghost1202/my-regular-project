name: Go CI

on:
  pull_request:
    branches:
      - dev

concurrency:
  group: go-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.28'
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test $(go list ./... | grep -v /test)
